<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta content="#ffffff" name="theme-color" />
    <meta content="strict-origin-when-cross-origin" name="referrer" />
    <title>Reset your UIORI password</title>
    <meta content="noindex,nofollow" name="robots" />
    <meta
      content="Start the process to reset your UIORI account password."
      name="description"
    />
    <link href="https://uiori.com/forgot-password/" rel="canonical" />
    <link href="/assets/img/favicon.svg" rel="icon" type="image/svg+xml" />
    <link
      href="/assets/img/favicon-32.png"
      rel="icon"
      sizes="32x32"
      type="image/png"
    />
    <link
      href="/assets/img/favicon-180.png"
      rel="apple-touch-icon"
      sizes="180x180"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link href="/assets/css/style.css" rel="stylesheet" />
    <script src="/assets/js/pages/auth.js" type="module"></script>
  </head>
  <body class="auth-page">
    <header class="auth-header">
      <div class="container auth-header-inner">
        <a aria-label="UIORI home" class="wordmark" href="/">
          UIORI<span class="wordmark-period">.</span>
        </a>
        <p class="auth-header-prompt recovery-auth-back">
          <span>Remembered it?</span>
          <a href="/login/">Log in</a>
        </p>
      </div>
    </header>
    <main class="auth-main">
      <section aria-labelledby="reset-title" class="auth-panel">
        <div class="auth-heading">
          <span aria-hidden="true" class="auth-heading-icon">
            <svg viewbox="0 0 24 24">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 7v5"></path>
              <path d="M12 16h.01"></path>
            </svg>
          </span>
          <h1 id="reset-title">Reset your password</h1>
          <p>
            Enter the email associated with your account. We’ll use it to start
            the password reset process.
          </p>
        </div>
        <form class="auth-form" id="forgot-form">
          <div class="auth-field">
            <label for="email-address">Email address</label>
            <input
              autocomplete="email"
              class="auth-input"
              id="email-address"
              name="email"
              required=""
              type="email"
            />
          </div>
          <button class="button button-dark auth-submit" type="submit">
            Send reset link
          </button>
          <p aria-live="polite" class="auth-message" data-auth-message></p>
        </form>
        <a class="auth-back-link" href="/login/">
          <svg aria-hidden="true" viewbox="0 0 24 24">
            <path d="M19 12H5"></path>
            <path d="m12 19-7-7 7-7"></path>
          </svg>
          <span>Back to log in</span>
        </a>
      </section>
    </main>
    <footer class="auth-footer">
      <span>© 2026 UIORI</span>
    </footer>
  </body>
</html>
