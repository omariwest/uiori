<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta content="#ffffff" name="theme-color" />
    <meta content="strict-origin-when-cross-origin" name="referrer" />
    <title>Admin sign in — UIORI</title>
    <meta
      content="Sign in to the UIORI administration area."
      name="description"
    />
    <meta content="noindex,nofollow" name="robots" />
    <link href="/assets/img/favicon.svg" rel="icon" type="image/svg+xml" />
    <link
      href="/assets/img/favicon-32.png"
      rel="icon"
      sizes="32x32"
      type="image/png"
    />
    <link
      href="/assets/img/favicon-180.png"
      rel="apple-touch-icon"
      sizes="180x180"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link href="/assets/css/style.css" rel="stylesheet" />
    <script src="/assets/js/pages/admin-auth.js" type="module"></script>
  </head>
  <body class="auth-page admin-auth-page">
    <header class="auth-header">
      <div class="container auth-header-inner">
        <a aria-label="UIORI home" class="wordmark" href="/"
          >UIORI<span class="wordmark-period">.</span></a
        >
        <p class="auth-header-prompt admin-auth-back">
          <span>Not an administrator?</span><a href="/">Back to website</a>
        </p>
      </div>
    </header>
    <main class="auth-main">
      <section
        aria-labelledby="admin-login-title"
        class="auth-panel admin-auth-panel"
      >
        <div class="auth-heading">
          <span aria-hidden="true" class="auth-heading-icon admin-auth-icon">
            <svg viewBox="0 0 24 24">
              <path
                d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
              ></path>
              <path d="M9 12l2 2 4-4"></path>
            </svg>
          </span>
          <h1 id="admin-login-title">Administrator access</h1>
          <p>Sign in with your UIORI administrator account.</p>
        </div>
        <form class="auth-form" id="admin-login-form">
          <div class="auth-field">
            <label for="admin-email">Email address</label>
            <input
              autocomplete="username"
              class="auth-input"
              id="admin-email"
              name="email"
              placeholder="Administrator email"
              required
              type="email"
            />
          </div>
          <div class="auth-field">
            <label for="admin-password">Password</label>
            <div class="password-control">
              <input
                autocomplete="current-password"
                class="auth-input"
                id="admin-password"
                name="password"
                placeholder="••••••••"
                required
                type="password"
              />
              <button
                aria-controls="admin-password"
                aria-label="Show password"
                class="password-toggle"
                data-password-label="password"
                data-password-toggle
                type="button"
              >
                <svg
                  aria-hidden="true"
                  class="password-icon password-icon-hidden"
                  viewBox="0 0 24 24"
                >
                  <path d="m3 3 18 18"></path>
                  <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                  <path
                    d="M9.9 5.1A10.9 10.9 0 0 1 12 5c5 0 9 5 9 7a11.7 11.7 0 0 1-3.2 3.9"
                  ></path>
                  <path
                    d="M6.6 6.6C4.4 8 3 10.1 3 12c0 2 4 7 9 7a10.7 10.7 0 0 0 4.4-.9"
                  ></path>
                </svg>
                <svg
                  aria-hidden="true"
                  class="password-icon password-icon-visible"
                  viewBox="0 0 24 24"
                >
                  <path
                    d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"
                  ></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
          <button class="button button-accent auth-submit" type="submit">
            Sign in to admin
          </button>
          <p
            aria-live="polite"
            class="auth-message"
            data-admin-auth-message
          ></p>
        </form>
        <p class="admin-auth-note">Restricted administration area.</p>
      </section>
    </main>
    <footer class="auth-footer"><span>© 2026 UIORI</span></footer>
  </body>
</html>
