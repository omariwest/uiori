<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta content="#ffffff" name="theme-color" />
    <meta content="strict-origin-when-cross-origin" name="referrer" />
    <meta content="noindex,nofollow" name="robots" />
    <title>Page not found — UIORI</title>
    <link href="/assets/img/favicon.svg" rel="icon" type="image/svg+xml" />
    <link
      href="/assets/img/favicon-32.png"
      rel="icon"
      sizes="32x32"
      type="image/png"
    />
    <link
      href="/assets/img/favicon-180.png"
      rel="apple-touch-icon"
      sizes="180x180"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link href="/assets/css/style.css" rel="stylesheet" />
    <script
      src="/assets/js/components/public-account.js"
      type="module"
    ></script>
  </head>
  <body class="auth-page">
    <header class="site-header">
      <div class="container header-inner">
        <a aria-label="UIORI home" class="wordmark" href="/"
          >UIORI<span class="wordmark-period">.</span></a
        >
        <div class="header-actions">
          <a class="login-link" href="/login/">Log in</a
          ><a class="button button-dark button-small" href="/signup/"
            >Start earning</a
          >
        </div>
      </div>
    </header>
    <main class="auth-main" id="main-content">
      <section class="auth-panel" aria-labelledby="not-found-title">
        <div class="auth-heading">
          <span aria-hidden="true" class="auth-brand-mark"
            ><img alt="" aria-hidden="true" src="/assets/img/favicon.svg"
          /></span>
          <p class="auth-field-note" style="margin-bottom: 10px">404</p>
          <h1 id="not-found-title">This page isn’t here.</h1>
          <p>The link may be outdated, or the page may have moved.</p>
        </div>
        <a
          class="button button-accent auth-submit"
          href="/"
          style="display: flex; justify-content: center; text-decoration: none"
          >Back to UIORI</a
        >
      </section>
    </main>
    <footer class="auth-footer"><span>© 2026 UIORI</span></footer>
  </body>
</html>
